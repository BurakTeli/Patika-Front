<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List App</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Custom styles -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div
            class="todo-container shadow-lg p-4 rounded"
            style="background: #232946"
          >
            <!-- App Title -->
            <h1 class="text-center mb-4" style="color: #fff">
              <i class="fas fa-tasks"></i>
              To-Do List
            </h1>

            <!-- Add Task Form -->
            <div class="add-task-form mb-4">
              <div class="input-group">
                <input
                  type="text"
                  id="taskInput"
                  class="form-control"
                  placeholder="Add a new task..."
                  maxlength="100"
                  autocomplete="off"
                />
                <button class="btn btn-primary" type="button" id="addTaskBtn">
                  <i class="fas fa-plus"></i> Add
                </button>
              </div>
              <!-- Error message -->
              <div class="invalid-feedback" id="errorMessage"></div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-buttons mb-3">
              <div class="btn-group w-100" role="group">
                <button
                  type="button"
                  class="btn btn-outline-secondary active"
                  data-filter="all"
                >
                  All (<span id="allCount">0</span>)
                </button>
                <button
                  type="button"
                  class="btn btn-outline-warning"
                  data-filter="active"
                >
                  Active (<span id="activeCount">0</span>)
                </button>
                <button
                  type="button"
                  class="btn btn-outline-success"
                  data-filter="completed"
                >
                  Completed (<span id="completedCount">0</span>)
                </button>
              </div>
            </div>

            <!-- Task List -->
            <div class="task-list">
              <ul id="taskList" class="list-group">
                <!-- Tasks will be rendered here -->
              </ul>
              <!-- Empty message -->
              <div
                id="emptyMessage"
                class="text-center text-muted py-5"
                style="display: none"
              >
                <i class="fas fa-clipboard-list fa-3x mb-3"></i>
                <p>No tasks yet. Start by adding your first task!</p>
              </div>
            </div>

            <!-- Clear Completed Button -->
            <div class="text-center mt-4">
              <button
                class="btn btn-danger"
                id="clearCompletedBtn"
                style="display: none"
              >
                <i class="fas fa-trash"></i> Clear Completed
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Script -->
    <script src="js/script.js"></script>
  </body>
</html>
