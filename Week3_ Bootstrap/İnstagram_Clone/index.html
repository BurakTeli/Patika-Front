<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Clone</title>

    <!-- Bootstrap & Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.1/css/all.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav
      class="navbar navbar-expand-sm navbar-light fixed-top border-bottom bg-white"
    >
      <div class="container d-flex justify-content-between align-items-center">
        <!-- Logo -->
        <a class="navbar-brand" href="#">
          <img
            src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png"
            alt="Instagram Logo"
          />
        </a>

        <!-- Search Box -->
        <form class="form-inline d-none d-sm-block">
          <input
            type="text"
            class="form-control"
            placeholder="Search"
            aria-label="Search"
          />
        </form>

        <!-- Navigation Icons -->
        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav d-flex align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="#"><i class="fas fa-home fa-lg"></i></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="far fa-compass fa-lg"></i
              ></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="far fa-heart fa-lg"></i
              ></a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="https://www.instagram.com/demirmelihcan"
                target="_blank"
              >
                <img
                  src="https://placehold.co/150x150?text=(-_-)"
                  alt="Profile Image"
                  class="rounded-circle"
                  style="width: 24px; height: 24px"
                />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </body>
</html>
